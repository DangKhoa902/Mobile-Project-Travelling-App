# Chạy backend + MariaDB:  docker compose up -d --build
# Nạp dữ liệu demo:        docker compose exec api npm run db:seed
# Biến môi trường đọc từ file .env cạnh file này (xem .env.example).
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: travelling_app
      MARIADB_USER: travelling
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://travelling:${DB_PASSWORD}@db:3306/travelling_app
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      BOOKING_TAX_RATE: ${BOOKING_TAX_RATE:-0.08}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Password123}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      APP_URL: ${APP_URL:-http://localhost:8081}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Travelling App <no-reply@travelling.app>}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      REQUEST_LOG: ${REQUEST_LOG:-true}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  db_data:
  uploads:
